CLIENT_CHUNK_MAP.label=Reducir el área cargada del mapa
CLIENT_CHUNK_MAP.tooltip=A partir de 1920×1080, reduce el área del mapa que carga el cliente de 19×19 a 13×13 chunks, aproximadamente un 53% menos. Al alejar el zoom, puede verse una zona más pequeña.
JAVA_PATHFINDING.label=Búsqueda de rutas en Java
JAVA_PATHFINDING.tooltip=Mantiene el motor Java de rutas durante la sesión, incluso si cambia la opción del motor nativo.
CHARACTER_STATS.label=Lectura de atributos
CHARACTER_STATS.tooltip=Lee los atributos y sus valores predeterminados como números primitivos, reduciendo el trabajo de las consultas frecuentes.
ACTOR_ALLOCATIONS.label=Memoria al actualizar personajes
ACTOR_ALLOCATIONS.tooltip=Reutiliza valores numéricos guardados e ID de animales pendientes de sincronización para reducir asignaciones temporales.
THERMAL_CLOTHING.label=Cálculo térmico de la ropa
THERMAL_CLOTHING.tooltip=Reutiliza las listas de ropa y la cobertura corporal de cada personaje, recalculándola cuando cambia su equipo.
ANIMAL_GROWTH.label=Genes de crecimiento animal
ANIMAL_GROWTH.tooltip=Reutiliza la clave normalizada del gen al consultar la edad de crecimiento de un animal.
ENTITY_REMOVAL.label=Eliminación de entidades
ENTITY_REMOVAL.tooltip=Indexa las posiciones de las entidades en la lista interna del motor para acelerar su eliminación por identidad.
LUA_DISPATCH.label=Ejecución de eventos Lua
LUA_DISPATCH.tooltip=Comprueba la función en el índice actual de la lista y recurre a una búsqueda completa cuando cambia de posición.
BLEND_DIRECTIONS.label=Transiciones de terreno
BLEND_DIRECTIONS.tooltip=Reutiliza la lista de direcciones al mezclar el terreno de los chunks para reducir los arreglos temporales.
REGION_LOOKUP.label=Búsqueda de celdas de región
REGION_LOOKUP.tooltip=Mantiene un índice con claves numéricas para consultar celdas de las regiones del mapa.
ZOMBIE_PACKETS.label=Preparación de paquetes de zombis
ZOMBIE_PACKETS.tooltip=Reduce asignaciones y cálculos de distancias al preparar paquetes de movimiento y estado de zombis.
ZOMBIE_CULLING.label=Selección de zombis para eliminar
ZOMBIE_CULLING.tooltip=Detiene la búsqueda de zombis para eliminar al alcanzar la cuota del servidor.
PLAYER_NEAR_VEHICLE.label=Proximidad a vehículos
PLAYER_NEAR_VEHICLE.tooltip=Omite las consultas de vehículos cercanos para jugadores remotos que no se mueven sigilosamente.
PARKED_VEHICLES.label=Actualización de vehículos estacionados
PARKED_VEHICLES.tooltip=Distribuye la actualización de vehículos estacionados entre grupos del planificador del servidor.
PERCEPTION_BUCKETS.label=Índice de percepción de zombis
PERCEPTION_BUCKETS.tooltip=Indexa los zombis por posición con claves numéricas y reutiliza el índice al completar las pruebas de visibilidad.
CHUNK_CONTAINERS.label=Contenedores al cargar chunks
CHUNK_CONTAINERS.tooltip=Reduce las comprobaciones de contenedores al integrar chunks en el mapa del servidor.
CHUNK_ADJACENCY.label=Vecindad al descargar chunks
CHUNK_ADJACENCY.tooltip=Reduce el trabajo de limpieza de las relaciones de vecindad al descargar un chunk.
CELL_RELEVANCE.label=Relevancia de celdas
CELL_RELEVANCE.tooltip=Indexa las celdas relevantes para los jugadores durante el fotograma de actualización del servidor.
CELL_BORDER.label=Bordes de celdas
CELL_BORDER.tooltip=Busca las casillas dentro de la celda al recalcular sus bordes y reduce consultas al mapa global.
ENTITY_BUCKET_REMOVAL.label=Eliminación en grupos de entidades
ENTITY_BUCKET_REMOVAL.tooltip=Indexa posiciones bajo demanda para acelerar la eliminación en los grupos de simulación de entidades.
ENTITY_SIMULATION.label=Simulación de entidades por lotes
ENTITY_SIMULATION.tooltip=Agrupa los ticks acumulados y escalona las entidades descargadas según su ID de red.
SERVER_LOS.label=Visibilidad en paralelo
SERVER_LOS.tooltip=Distribuye las pruebas de línea de visión entre hilos de trabajo y aplica los resultados en el hilo del servidor.
ZOMBIE_ASYNC_SEND.label=Envío asíncrono de zombis
ZOMBIE_ASYNC_SEND.tooltip=Envía lotes de actualizaciones de zombis mediante una cola asíncrona fuera del hilo de simulación.
CHUNK_ASYNC_SEND.label=Respuestas asíncronas de chunks
CHUNK_ASYNC_SEND.tooltip=Transfiere las respuestas de estado de chunks al hilo de descarga del servidor.
WORKSHOP_ASYNC.label=Consulta asíncrona de Steam Workshop
WORKSHOP_ASYNC.tooltip=Consulta las actualizaciones de Steam Workshop en segundo plano para reducir bloqueos durante la simulación del servidor.
