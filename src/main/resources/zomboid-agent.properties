CLIENT_CHUNK_MAP.label=Reduzir a área carregada do mapa
CLIENT_CHUNK_MAP.tooltip=Em 1920×1080 ou mais, reduz a área do mapa carregada pelo cliente de 19×19 para 13×13 chunks, cerca de 53% menos chunks. A área visível pode diminuir com o zoom afastado.
JAVA_PATHFINDING.label=Busca de caminhos em Java
JAVA_PATHFINDING.tooltip=Mantém o cálculo de rotas no mecanismo Java do jogo durante toda a sessão, inclusive se a configuração do mecanismo nativo mudar.
CHARACTER_STATS.label=Leitura de atributos
CHARACTER_STATS.tooltip=Lê valores de atributos e seus padrões como números primitivos, reduzindo trabalho nas consultas frequentes.
ACTOR_ALLOCATIONS.label=Memória na atualização de personagens
ACTOR_ALLOCATIONS.tooltip=Reutiliza valores numéricos já armazenados e IDs de animais pendentes de sincronização para reduzir alocações temporárias.
THERMAL_CLOTHING.label=Cálculo térmico das roupas
THERMAL_CLOTHING.tooltip=Reutiliza a lista de roupas e a cobertura do corpo por personagem, recalculando a cobertura quando seu equipamento muda.
ANIMAL_GROWTH.label=Genes de crescimento animal
ANIMAL_GROWTH.tooltip=Reutiliza a chave normalizada do gene ao consultar a idade de crescimento de um animal.
ENTITY_REMOVAL.label=Remoção de entidades
ENTITY_REMOVAL.tooltip=Indexa as posições das entidades na lista interna do motor para acelerar remoções por identidade.
LUA_DISPATCH.label=Execução de eventos Lua
LUA_DISPATCH.tooltip=Valida o callback no índice atual da lista e faz uma busca completa quando a lista mudou de posição.
BLEND_DIRECTIONS.label=Transições de terreno
BLEND_DIRECTIONS.tooltip=Reutiliza a lista de direções ao mesclar o terreno dos chunks, reduzindo a criação de arrays temporários.
REGION_LOOKUP.label=Busca de células de região
REGION_LOOKUP.tooltip=Mantém um índice com chaves numéricas para consultar as células das regiões do mapa.
ZOMBIE_PACKETS.label=Preparação de pacotes de zumbis
ZOMBIE_PACKETS.tooltip=Reduz alocações e cálculos de distância ao preparar pacotes de movimento e estado dos zumbis.
ZOMBIE_CULLING.label=Seleção de zumbis para remoção
ZOMBIE_CULLING.tooltip=Encerra a busca de zumbis para remoção assim que a cota do servidor é preenchida.
PLAYER_NEAR_VEHICLE.label=Proximidade de veículos
PLAYER_NEAR_VEHICLE.tooltip=Pula consultas de veículos próximos para jogadores remotos que não estão se esgueirando.
PARKED_VEHICLES.label=Atualização de veículos estacionados
PARKED_VEHICLES.tooltip=Distribui a atualização de veículos estacionados entre grupos do agendador do servidor.
PERCEPTION_BUCKETS.label=Índice de percepção de zumbis
PERCEPTION_BUCKETS.tooltip=Indexa zumbis por posição com chaves numéricas e reutiliza o índice ao concluir testes de visibilidade.
CHUNK_CONTAINERS.label=Contêineres ao carregar chunks
CHUNK_CONTAINERS.tooltip=Reduz verificações de contêineres feitas durante a integração de chunks ao mapa do servidor.
CHUNK_ADJACENCY.label=Vizinhança ao descarregar chunks
CHUNK_ADJACENCY.tooltip=Reduz o trabalho de limpeza das relações de vizinhança quando o servidor descarrega um chunk.
CELL_RELEVANCE.label=Relevância de células
CELL_RELEVANCE.tooltip=Indexa quais células são relevantes para os jogadores durante o quadro de atualização do servidor.
CELL_BORDER.label=Bordas de células
CELL_BORDER.tooltip=Busca quadrados na própria célula ao recalcular suas bordas, reduzindo consultas ao mapa global.
ENTITY_BUCKET_REMOVAL.label=Remoção em grupos de entidades
ENTITY_BUCKET_REMOVAL.tooltip=Indexa posições sob demanda para acelerar remoções nos grupos da simulação de entidades.
ENTITY_SIMULATION.label=Simulação de entidades em lote
ENTITY_SIMULATION.tooltip=Agrupa ticks acumulados e escalona entidades fora da área carregada usando seu ID de rede.
SERVER_LOS.label=Visibilidade em paralelo
SERVER_LOS.tooltip=Distribui testes de linha de visão entre workers e aplica os resultados na thread do servidor.
ZOMBIE_ASYNC_SEND.label=Envio assíncrono de zumbis
ZOMBIE_ASYNC_SEND.tooltip=Envia lotes de atualizações de zumbis por uma fila assíncrona fora da thread de simulação.
CHUNK_ASYNC_SEND.label=Respostas assíncronas de chunks
CHUNK_ASYNC_SEND.tooltip=Transfere respostas de status de chunks para o worker de download do servidor.
WORKSHOP_ASYNC.label=Consulta assíncrona da Oficina Steam
WORKSHOP_ASYNC.tooltip=Consulta atualizações da Oficina Steam em segundo plano para reduzir bloqueios durante a simulação do servidor.
