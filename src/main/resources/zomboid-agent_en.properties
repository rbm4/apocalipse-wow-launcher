JAVA_PATHFINDING.label=Java pathfinding
JAVA_PATHFINDING.tooltip=Keeps the game on its Java pathfinder for the session, including when the native pathfinder setting changes.
CHARACTER_STATS.label=Character stat lookup
CHARACTER_STATS.tooltip=Reads stat values and defaults as primitive numbers, reducing work in frequent lookups.
ACTOR_ALLOCATIONS.label=Actor update allocations
ACTOR_ALLOCATIONS.tooltip=Reuses stored numeric values and animal IDs queued for synchronization to reduce temporary allocations.
THERMAL_CLOTHING.label=Clothing thermoregulation
THERMAL_CLOTHING.tooltip=Reuses per-character clothing lists and body coverage, rebuilding coverage when equipment changes.
ANIMAL_GROWTH.label=Animal growth gene lookup
ANIMAL_GROWTH.tooltip=Reuses the normalized gene key when looking up an animal’s growth age.
ENTITY_REMOVAL.label=Engine entity removal
ENTITY_REMOVAL.tooltip=Indexes entity positions in the engine’s internal list to speed up removals by identity.
LUA_DISPATCH.label=Lua event dispatch
LUA_DISPATCH.tooltip=Checks the callback at the current list index and falls back to a full lookup when it has moved.
BLEND_DIRECTIONS.label=Terrain blending
BLEND_DIRECTIONS.tooltip=Reuses the direction list while blending chunk terrain to reduce temporary array allocations.
REGION_LOOKUP.label=Region cell lookup
REGION_LOOKUP.tooltip=Maintains an index with primitive numeric keys for map region cell lookups.
ZOMBIE_PACKETS.label=Zombie packet preparation
ZOMBIE_PACKETS.tooltip=Reduces allocations and distance calculations when preparing zombie movement and state packets.
ZOMBIE_CULLING.label=Zombie culling quota
ZOMBIE_CULLING.tooltip=Stops scanning for zombies to remove once the server’s quota is filled.
PLAYER_NEAR_VEHICLE.label=Remote player vehicle proximity
PLAYER_NEAR_VEHICLE.tooltip=Skips nearby-vehicle lookups for remote players who are not sneaking.
PARKED_VEHICLES.label=Parked vehicle updates
PARKED_VEHICLES.tooltip=Spreads parked vehicle updates across scheduler buckets on the server.
PERCEPTION_BUCKETS.label=Zombie perception index
PERCEPTION_BUCKETS.tooltip=Indexes zombies by position with primitive keys and reuses the index across visibility test completions.
CHUNK_CONTAINERS.label=Chunk container checks
CHUNK_CONTAINERS.tooltip=Reduces container checks while chunks are integrated into the server map.
CHUNK_ADJACENCY.label=Chunk adjacency cleanup
CHUNK_ADJACENCY.tooltip=Reduces adjacency cleanup work when the server unloads a chunk.
CELL_RELEVANCE.label=Cell relevance index
CELL_RELEVANCE.tooltip=Indexes which cells are relevant to players during a server update frame.
CELL_BORDER.label=Cell border lookups
CELL_BORDER.tooltip=Looks up squares within the current cell while recalculating borders, reducing global map lookups.
ENTITY_BUCKET_REMOVAL.label=Entity bucket removal
ENTITY_BUCKET_REMOVAL.tooltip=Indexes positions on demand to speed up removal from entity simulation buckets.
ENTITY_SIMULATION.label=Batched entity simulation
ENTITY_SIMULATION.tooltip=Batches accumulated ticks and staggers unloaded entities by network ID.
SERVER_LOS.label=Parallel line of sight
SERVER_LOS.tooltip=Distributes line-of-sight tests among workers and applies the results on the server thread.
ZOMBIE_ASYNC_SEND.label=Asynchronous zombie updates
ZOMBIE_ASYNC_SEND.tooltip=Sends batches of zombie updates through an asynchronous queue outside the simulation thread.
CHUNK_ASYNC_SEND.label=Asynchronous chunk replies
CHUNK_ASYNC_SEND.tooltip=Moves chunk status replies to the server’s download worker.
WORKSHOP_ASYNC.label=Asynchronous Steam Workshop checks
WORKSHOP_ASYNC.tooltip=Checks for Steam Workshop updates in the background to reduce blocking during server simulation.
